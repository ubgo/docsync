# Windows: does docsync work there, not merely compile for it.
#
# The release ships ds.exe, cross-built on a Mac. Until this workflow ran, no
# part of docsync had been started on Windows: the claim rested on a
# cross-compile. This runs the Go tests of every module natively, builds ds.exe
# from source and drives it through scripts/windows-smoke.ps1 and through the
# end-to-end matrices (scripts/e2e, under Git Bash), then installs the
# published release with install.ps1 and drives that binary the same way. A
# second job runs the same matrices on Linux.
#
# Manual only. Run it from the Actions tab, or: gh workflow run windows.yml
# It belongs before every release and after any change to paths, locking,
# process spawning or line-ending handling. To run it automatically, replace
# the `on:` block with:
#
#   on:
#     workflow_dispatch:
#     push:
#       branches: [main]
#     pull_request:
name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Both architectures the release ships for. fail-fast is off so that one
    # failing does not hide what the other would have reported.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The ARM runner's gcc is an x86_64 MinGW, which cannot compile C for
      # arm64, so cgo (the tree-sitter tier, and ds itself) would fail to build
      # from source there. llvm-mingw ships a native ARM64 toolchain; it is
      # pinned, and put first on PATH so `gcc` is the one that matches GOARCH.
      - name: C compiler for ARM64
        if: runner.arch == 'ARM64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_MINGW: "20260922"
        run: |
          $zip = "llvm-mingw-$env:LLVM_MINGW-ucrt-aarch64.zip"
          gh release download $env:LLVM_MINGW -R mstorsjo/llvm-mingw -p $zip -D $env:RUNNER_TEMP
          Expand-Archive (Join-Path $env:RUNNER_TEMP $zip) -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW-ucrt-aarch64/bin"
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) { throw "no gcc.exe in $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Toolchain
        shell: pwsh
        run: |
          go version
          go env GOARCH
          git --version
          # cgo needs a C compiler; say which one is here, or that none is.
          $cc = Get-Command gcc, clang -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cc) { & $cc.Source --version | Select-Object -First 1 } else { Write-Host "no C compiler on PATH: the cgo steps will fail" }

      # Every test step runs even when an earlier one failed, so one run
      # reports everything that is wrong on this platform.
      - name: Test the root library
        if: always()
        shell: pwsh
        run: go test -count=1 ./...

      - name: Test ext/structured
        if: always()
        shell: pwsh
        working-directory: ext/structured
        run: go test -count=1 ./...

      - name: Test ext/records/sqlite
        if: always()
        shell: pwsh
        working-directory: ext/records/sqlite
        run: go test -count=1 ./...

      - name: Test ext/treesitter (cgo)
        if: always()
        shell: pwsh
        working-directory: ext/treesitter
        run: go test -count=1 ./...

      - name: Test the cli module
        if: always()
        shell: pwsh
        working-directory: cli
        run: go test -count=1 ./...

      - name: Build ds.exe and the plugins from source
        if: always()
        shell: pwsh
        working-directory: cli
        run: |
          New-Item -ItemType Directory -Force -Path ../bin | Out-Null
          go build -o ../bin/ ./cmd/...
          Get-ChildItem ../bin

      - name: Smoke the build from source
        if: always()
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Ds bin/ds.exe

      # The same matrices `task e2e` runs on a Mac, under Git Bash: several
      # commands in sequence, git history, merges, more than one repo. The
      # scripts are POSIX sh, so this also proves a Windows user working in
      # Git Bash gets the same behaviour. autocrlf is turned off because the
      # matrices commit fixtures whose exact bytes are the thing under test.
      - name: End-to-end matrices under Git Bash
        if: always()
        shell: bash
        run: |
          git config --global core.autocrlf false
          # The scripts call python3; a Windows Python is often only `python`.
          if ! command -v python3 >/dev/null 2>&1 && command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shim"
            printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3"
            PATH="$RUNNER_TEMP/shim:$PATH"
          fi
          sh scripts/e2e/run.sh

      - name: Install the published release with install.ps1
        if: always()
        shell: pwsh
        run: |
          $env:INSTALL_DIR = Join-Path $env:RUNNER_TEMP "ds-release"
          ./install.ps1
          Get-ChildItem $env:INSTALL_DIR
          & (Join-Path $env:INSTALL_DIR "ds.exe") version

      - name: Smoke the published release
        if: always()
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Ds (Join-Path $env:RUNNER_TEMP "ds-release/ds.exe")

  # The end-to-end matrices on Linux. They are written on a Mac, and BSD and
  # GNU tools differ (sed -i, date); this is the run that shows a contributor
  # on Linux gets a working `task e2e`.
  e2e-linux:
    name: e2e on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build ds and the plugins
        working-directory: cli
        run: |
          mkdir -p ../bin
          go build -o ../bin/ ./cmd/...
      - name: End-to-end matrices
        run: sh scripts/e2e/run.sh
